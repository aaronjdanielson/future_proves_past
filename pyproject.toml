[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "future-proves-past"
version = "0.1.0"
description = "Reference probability model and dated data contracts for international-to-NCAA translation"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "scipy>=1.11"]

[project.optional-dependencies]
# Milestone 0.2 track 3: differentiable likelihood and validation harness.
model = ["torch>=2.2"]
# Track 1: assembled training tables from the upstream SQLite stores.
data = ["pandas>=2.2", "pyarrow>=15"]
dev = ["pytest>=8.0"]

[project.scripts]
fpp = "fpp.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["fpp*"]
